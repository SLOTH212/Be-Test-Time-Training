auto_shutdown:
  enabled: true
  on_success: true
  on_failure: false
  delay_seconds: 300
  cancel_file: ${TTT_TRAINING_ROOT}/locks/CANCEL_AUTO_SHUTDOWN
  block_if_other_workload_detected: true
  dry_run: false
implementation:
  smoke_auto_shutdown_dry_run: true
  formal_training_ack_env: CONFIRM_FORMAL_GATED_NTP_PIPELINE
  formal_training_ack_value: YES

