[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-ttt"
version = "0.1.0"
description = "Dynamic Recomputed Lower Bound for NTP test-time training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6", "filelock>=3.13"]

[project.optional-dependencies]
models = ["torch>=2.8", "transformers==4.57.3", "tokenizers>=0.22,<0.23", "safetensors>=0.7", "einops>=0.8", "opt_einsum>=3.4"]
training = ["liger-kernel==0.8.0"]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
dynamic-ttt = "dynamic_ttt.cli:main"

[tool.setuptools]
license-files = ["licenses/Apache-2.0.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
dynamic_ttt = ["training/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
